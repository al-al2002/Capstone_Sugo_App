<!--
  SUGO: the email behind the registration flow's contact step.

  Replaces Supabase's default magic-link mail, which renders only
  {{ .ConfirmationURL }} - a link, and nothing a person can type.

  The link is deliberately absent. The app asks for a code and waits for it;
  a link in this mail would let somebody sign in from their inbox while the
  registration screen sat there expecting six digits that never arrive.

  Table layout and inline styles on purpose. Gmail and Outlook strip <style>
  blocks and do not implement flexbox, so anything cleverer renders as a
  stack of unstyled text in exactly the clients most people read mail in.
-->
<table width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:#F4F8FF;padding:32px 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" border="0"
             style="max-width:480px;background:#FFFFFF;border-radius:20px;border:1px solid #E3E9F2;">
        <tr>
          <td style="padding:32px 32px 8px 32px;">
            <p style="margin:0;font-size:13px;font-weight:700;letter-spacing:1.5px;color:#1877F2;text-transform:uppercase;">
              SUGO
            </p>
            <h1 style="margin:12px 0 0 0;font-size:22px;font-weight:800;color:#1B1F2A;">
              Confirm your email
            </h1>
            <p style="margin:8px 0 0 0;font-size:14px;line-height:1.5;color:#6B7280;">
              Enter this code in the app to finish setting up your account.
            </p>
          </td>
        </tr>

        <tr>
          <td style="padding:24px 32px;">
            <table width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="background:#E8F1FE;border-radius:16px;">
              <tr>
                <td align="center" style="padding:22px 16px;">
                  <span style="font-size:34px;font-weight:800;letter-spacing:10px;color:#0D5BC4;font-family:'SF Mono',Menlo,Consolas,monospace;">
                    {{ .Token }}
                  </span>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td style="padding:0 32px 32px 32px;">
            <p style="margin:0;font-size:13px;line-height:1.55;color:#6B7280;">
              The code expires shortly and can only be used once. If you did not
              start a SUGO registration, you can ignore this email - nothing
              happens until the code is entered.
            </p>
          </td>
        </tr>
      </table>

      <p style="margin:20px 0 0 0;font-size:11.5px;color:#9CA3AF;">
        SUGO &middot; Ask. Book. Done.
      </p>
    </td>
  </tr>
</table>
