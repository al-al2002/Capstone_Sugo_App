# Sized for this machine, which has ~7.8 GB of physical RAM.
#
# This was -Xmx8G with a 4 GB metaspace: more than the whole machine, before
# Windows and everything else took their share. The Gradle daemon crashed
# mid-build with "Native memory allocation (malloc) failed ... Out of Memory
# Error (arena.cpp)" - a JVM crash rather than a Gradle error, which is why it
# read as "daemon disappeared unexpectedly" instead of naming the cause.
#
# 2 GB of heap builds this project comfortably. Raise it only on a machine with
# the RAM to back it.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Jetifier rewrites legacy android.support.* references to AndroidX. Every
# dependency in this project is already AndroidX - Flutter, Firebase, the
# plugins - so it had nothing to do but unpack and repack every jar.
#
# It was also failing: "Insufficient system resources exist to complete the
# requested service" while transforming the Flutter engine jar, on a machine
# with 7.8 GB of RAM. Turning it off removes the work and the failure.
#
# Turn it back on only if a genuinely pre-AndroidX library is ever added.
android.enableJetifier=false
