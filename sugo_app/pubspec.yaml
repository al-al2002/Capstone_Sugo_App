name: sugo_app
description: "SUGO - Ask. Book. Done. On-demand errand and delivery booking."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  provider: ^6.1.5+1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  image_picker: ^1.2.2
  intl: ^0.20.3
  cross_file: ^0.3.5+2
  geolocator: ^14.0.2

  # Nominatim geocoding in the location-pinning steps. Already present as a
  # transitive dependency of supabase_flutter; declared directly because we
  # import it ourselves, which `depend_on_referenced_packages` requires.
  http: ^1.2.2

  # Small on-device preferences: favourite technicians, recent searches, and
  # the read state of the derived notification feed. Like `http` above, this
  # is already a transitive dependency
  # (supabase_flutter persists its session with it), so declaring it adds no
  # new download - it only lets us import it ourselves.
  #
  # Deliberately device-local. None of these needed a table: a favourite that
  # does not follow you to a new phone is a small loss, and the alternative was
  # a schema change for a convenience feature.
  shared_preferences: ^2.5.3

  # Dialling a technician, and opening their workshop in a maps app. Also
  # already transitive (supabase_flutter opens the OAuth browser with it), so
  # declaring it costs no new download.
  #
  # Needed because the "Call" button used to show a "Opening call..." snackbar
  # and do nothing - the one kind of button that should never exist.
  url_launcher: ^6.3.1

  # Firebase, used for ONE thing: phone number verification.
  #
  # Supabase remains the platform - accounts, data, storage, realtime. Firebase
  # Phone Auth is here purely as an SMS transport, because its free tier sends
  # real messages while Supabase's phone provider needs a funded Twilio account
  # behind it.
  #
  # A Firebase user is NOT a SUGO user. Nobody signs in with it; it proves
  # control of a number, and that proof is recorded against the Supabase
  # profile. See the note in main.dart.
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7

  # Push notifications, used for ONE thing: telling a client their technician
  # is running late while the app is closed. Realtime already covers the
  # app-open case, so this exists purely for the pocket.
  #
  # Constraint deliberately loose so pub can pick whatever is self-consistent
  # with the firebase_core_web pin below - see that note.
  firebase_messaging: ^16.0.0

  # Held below 3.11.0 deliberately, and not by choice.
  #
  # firebase_core_web 3.11.0 calls `e.isA<JSObject>()` on a catch variable,
  # whose static type is `Object`. In Dart 3.9.2 `isA` is only declared on
  # `JSAny?`; it does not reach `Object?` until Dart 3.10. The package still
  # advertises `sdk: ^3.6.0`, so pub selects it on our toolchain and the web
  # build fails to compile inside the package itself.
  #
  # Pinning it here forces pub to pick the last self-consistent Firebase set
  # for Dart 3.9.2 - core 4.13.0, auth 6.5.7, auth_web 6.2.6. Drop this pin and
  # raise the two constraints above once we move to a Flutter release carrying
  # Dart 3.10 or newer.
  firebase_core_web: '>=3.10.0 <3.11.0'

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

  # Writes the launcher icon into every platform folder from one source image,
  # driven by the `flutter_launcher_icons:` section at the bottom of this file.
  # A dev dependency because it runs on a developer's machine, never in the app.
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Optional artwork. The auth screens draw their illustration in code and fall
  # back gracefully, so this folder may stay empty until the exports land.
  assets:
    - assets/images/

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # The app's typeface. Bundled rather than fetched with google_fonts so the
  # first frame already has it, offline included - a font that swaps in a
  # second after launch makes every screen visibly reflow.
  #
  # Five static weights rather than the variable file: Flutter does not map
  # `fontWeight` onto a variable font's `wght` axis on every platform, and a
  # synthesised bold is exactly the cheap look this is meant to remove.
  # SIL Open Font License - see assets/fonts/OFL.txt.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# ---------------------------------------------------------------- app icon
#
# Regenerate after changing the artwork:
#
#   python tool/prepare_brand_images.py   # cleans assets/images/app icon.png
#   dart run flutter_launcher_icons       # writes it into every platform
#
# The source export has the transparency checkerboard painted into its
# corners, so it is never fed to the generator directly - the script above
# explains why and writes the two files used here.
flutter_launcher_icons:
  # Overwrite the default `ic_launcher`, which AndroidManifest.xml already
  # points at, rather than add a second icon name beside it.
  android: true
  ios: true
  image_path: "assets/icon/app_icon_full.png"

  # Android before 8.0 shows the file exactly as given, so it gets the rounded
  # square on transparency - a full square would look like a flat tile.
  image_path_android: "assets/icon/app_icon_rounded.png"
  min_sdk_android: 21

  # Android 8+ masks the icon itself (circle, squircle, teardrop - the
  # launcher decides). The foreground already has the artwork shrunk into the
  # safe circle with navy painted around it (see the script), so no further
  # inset: the generator's default of 16% would shrink it a second time. The
  # background colour is the icon's own edge navy, so nothing shows as a seam
  # when the launcher animates the two layers apart.
  adaptive_icon_foreground: "assets/icon/app_icon_adaptive.png"
  adaptive_icon_background: "#03265E"
  adaptive_icon_foreground_inset: 0

  # iOS refuses icons with an alpha channel and rounds the corners itself.
  remove_alpha_ios: true
  background_color_ios: "#03265E"

  web:
    generate: true
    image_path: "assets/icon/app_icon_rounded.png"
    background_color: "#03265E"
    theme_color: "#0F2A5C"

  windows:
    generate: true
    image_path: "assets/icon/app_icon_rounded.png"
    icon_size: 256

  macos:
    generate: true
    image_path: "assets/icon/app_icon_rounded.png"
